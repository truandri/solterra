<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EBE3D7"/>
    </linearGradient>
    <linearGradient id="tubeAlum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FAF8F5"/>
      <stop offset="70%" stop-color="#F2EAE0"/>
      <stop offset="100%" stop-color="#D9CEC1"/>
    </linearGradient>
    <filter id="tubeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#023047" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgSun)"/>

  <!-- Sun Graphic in background -->
  <circle cx="400" cy="270" r="160" fill="#ffb703" opacity="0.15"/>
  <circle cx="400" cy="270" r="110" fill="#fb8500" opacity="0.12"/>

  <!-- Pure Sol Aluminium Sunscreen Tube -->
  <g filter="url(#tubeShadow)" transform="translate(300, 80)">
    <!-- Tube Body (Crimped end at top, cap at bottom) -->
    <path d="M40 40 L160 40 L180 320 L20 320 Z" fill="url(#tubeAlum)" stroke="#023047" stroke-width="3"/>
    
    <!-- Top Crimped Seal -->
    <rect x="35" y="30" width="130" height="15" rx="3" fill="#D9CEC1" stroke="#023047" stroke-width="2"/>
    <line x1="45" y1="33" x2="45" y2="42" stroke="#786A59" stroke-width="2"/>
    <line x1="65" y1="33" x2="65" y2="42" stroke="#786A59" stroke-width="2"/>
    <line x1="85" y1="33" x2="85" y2="42" stroke="#786A59" stroke-width="2"/>
    <line x1="105" y1="33" x2="105" y2="42" stroke="#786A59" stroke-width="2"/>
    <line x1="125" y1="33" x2="125" y2="42" stroke="#786A59" stroke-width="2"/>
    <line x1="145" y1="33" x2="145" y2="42" stroke="#786A59" stroke-width="2"/>

    <!-- Label Artwork on Tube -->
    <circle cx="100" cy="130" r="32" fill="#ffb703"/>
    <circle cx="100" cy="130" r="22" fill="#fb8500"/>
    <text x="100" y="136" fill="#023047" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" text-anchor="middle">50+</text>

    <text x="100" y="190" fill="#023047" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" text-anchor="middle" letter-spacing="2">PURE SOL</text>
    <text x="100" y="210" fill="#219ebc" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle" letter-spacing="1">MINERAL SUN SHIELD</text>
    
    <rect x="50" y="230" width="100" height="2" fill="#023047" opacity="0.3"/>
    <text x="100" y="248" fill="#023047" font-family="sans-serif" font-weight="600" font-size="9" text-anchor="middle">NON-NANO ZINC OXIDE</text>
    <text x="100" y="262" fill="#023047" font-family="sans-serif" font-weight="600" font-size="9" text-anchor="middle">100% REEF SAFE • 150ML</text>
    <text x="100" y="285" fill="#2a6f5d" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">AUSTRALIAN BOTANICALS</text>

    <!-- Octagonal Recycled Bamboo/Polymer Screw Cap -->
    <polygon points="50,320 150,320 160,380 40,380" fill="#023047" stroke="#ffb703" stroke-width="2"/>
    <line x1="75" y1="320" x2="70" y2="380" stroke="#219ebc" stroke-width="2"/>
    <line x1="100" y1="320" x2="100" y2="380" stroke="#219ebc" stroke-width="2"/>
    <line x1="125" y1="320" x2="130" y2="380" stroke="#219ebc" stroke-width="2"/>
  </g>

  <!-- Tag -->
  <g transform="translate(540, 480)">
    <rect width="210" height="52" rx="14" fill="#023047"/>
    <text x="105" y="24" fill="#ffb703" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="2">REEF SAFE FORMULA</text>
    <text x="105" y="41" fill="#8ecae6" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Recyclable Aluminium Tube</text>
  </g>
</svg>
