<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFEA"/>
      <stop offset="100%" stop-color="#E2DDD4"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="30%" stop-color="#9CA3AF"/>
      <stop offset="70%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="hempPouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2B194"/>
      <stop offset="100%" stop-color="#9E8D71"/>
    </linearGradient>
    <filter id="cutleryShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#023047" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgS)"/>

  <!-- Hemp Roll Pouch Background -->
  <g filter="url(#cutleryShadow)" transform="translate(150, 100)">
    <rect x="0" y="20" width="500" height="380" rx="24" fill="url(#hempPouch)" stroke="#78684E" stroke-width="3"/>
    <!-- Stitched Pockets -->
    <line x1="125" y1="120" x2="125" y2="400" stroke="#524532" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="250" y1="120" x2="250" y2="400" stroke="#524532" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="375" y1="120" x2="375" y2="400" stroke="#524532" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Fork -->
    <g transform="translate(45, 40)">
      <rect x="22" y="140" width="16" height="190" rx="8" fill="url(#titanium)" stroke="#4B5563" stroke-width="2"/>
      <circle cx="30" cy="305" r="5" fill="#F4EFEA"/> <!-- carabiner cutout -->
      <!-- Tines -->
      <path d="M10 50 Q 30 140 30 150 Q 30 140 50 50 Z" fill="url(#titanium)" stroke="#4B5563" stroke-width="2"/>
      <rect x="18" y="45" width="4" height="65" rx="2" fill="#9E8D71"/>
      <rect x="28" y="45" width="4" height="65" rx="2" fill="#9E8D71"/>
      <rect x="38" y="45" width="4" height="65" rx="2" fill="#9E8D71"/>
    </g>

    <!-- Spoon -->
    <g transform="translate(170, 40)">
      <rect x="22" y="140" width="16" height="190" rx="8" fill="url(#titanium)" stroke="#4B5563" stroke-width="2"/>
      <circle cx="30" cy="305" r="5" fill="#F4EFEA"/>
      <ellipse cx="30" cy="80" rx="26" ry="42" fill="url(#titanium)" stroke="#4B5563" stroke-width="2"/>
      <ellipse cx="30" cy="80" rx="18" ry="30" fill="#9CA3AF" opacity="0.4"/>
    </g>

    <!-- Serrated Knife -->
    <g transform="translate(295, 40)">
      <rect x="22" y="140" width="16" height="190" rx="8" fill="url(#titanium)" stroke="#4B5563" stroke-width="2"/>
      <circle cx="30" cy="305" r="5" fill="#F4EFEA"/>
      <path d="M22 140 L22 45 Q 38 45 38 75 L38 140 Z" fill="url(#titanium)" stroke="#4B5563" stroke-width="2"/>
      <!-- Serrations -->
      <line x1="38" y1="65" x2="34" y2="67" stroke="#4B5563" stroke-width="2"/>
      <line x1="38" y1="75" x2="34" y2="77" stroke="#4B5563" stroke-width="2"/>
      <line x1="38" y1="85" x2="34" y2="87" stroke="#4B5563" stroke-width="2"/>
    </g>

    <!-- Reusable Titanium Straw with Cleaning Brush -->
    <g transform="translate(420, 40)">
      <rect x="24" y="30" width="12" height="300" rx="6" fill="url(#titanium)" stroke="#4B5563" stroke-width="2"/>
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(540, 490)">
    <rect width="210" height="52" rx="14" fill="#023047"/>
    <text x="105" y="24" fill="#ffb703" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="2">GRADE-5 TITANIUM</text>
    <text x="105" y="41" fill="#8ecae6" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Ultralight • 46 Grams</text>
  </g>
</svg>
