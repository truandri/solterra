<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EFE8DD"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb8500"/>
      <stop offset="35%" stop-color="#8a3b00"/>
      <stop offset="70%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#3d1e00"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023047" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#219ebc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#023047" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#023047" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Contour Lines representing Australian Coastal Headlands -->
  <path d="M-50 480 Q 200 420 450 490 T 850 460" fill="none" stroke="#219ebc" stroke-width="1.5" stroke-opacity="0.2"/>
  <path d="M-50 510 Q 220 450 480 520 T 850 490" fill="none" stroke="#fb8500" stroke-width="1.5" stroke-opacity="0.15"/>
  <path d="M-50 540 Q 240 480 500 550 T 850 520" fill="none" stroke="#023047" stroke-width="1.5" stroke-opacity="0.1"/>

  <!-- Eco Bio-Acetate Eyewear -->
  <g filter="url(#shadow)" transform="translate(100, 160)">
    <!-- Left Temple arm in perspective -->
    <path d="M40 90 L-40 60 Q -70 50 -90 90 L-80 110 Q -60 75 -35 85 L35 110 Z" fill="#b05d00" opacity="0.85"/>
    
    <!-- Right Temple arm in perspective -->
    <path d="M560 90 L640 60 Q 670 50 690 90 L680 110 Q 660 75 635 85 L565 110 Z" fill="#b05d00" opacity="0.85"/>

    <!-- Left Frame Rim -->
    <rect x="50" y="50" width="220" height="150" rx="40" fill="url(#frameGrad)" stroke="#ffb703" stroke-width="3"/>
    
    <!-- Right Frame Rim -->
    <rect x="330" y="50" width="220" height="150" rx="40" fill="url(#frameGrad)" stroke="#ffb703" stroke-width="3"/>
    
    <!-- Bridge -->
    <path d="M260 95 Q 300 80 340 95 Q 300 115 260 95 Z" fill="url(#frameGrad)"/>
    <circle cx="300" cy="98" r="4" fill="#ffb703"/>

    <!-- Left Lens -->
    <rect x="65" y="65" width="190" height="120" rx="30" fill="url(#lensGrad)"/>
    <!-- Glare reflection -->
    <path d="M75 75 L160 75 L120 175 L75 175 Z" fill="url(#glare)"/>
    
    <!-- Right Lens -->
    <rect x="345" y="65" width="190" height="120" rx="30" fill="url(#lensGrad)"/>
    <!-- Glare reflection -->
    <path d="M355 75 L440 75 L400 175 L355 175 Z" fill="url(#glare)"/>

    <!-- Bio-Acetate Botanical Emblem -->
    <circle cx="85" cy="85" r="9" fill="#023047" opacity="0.6"/>
    <path d="M85 78 C82 82 82 86 85 91 C88 86 88 82 85 78 Z" fill="#8ecae6"/>

    <!-- Golden Hinge Pins -->
    <circle cx="58" cy="70" r="3" fill="#ffb703"/>
    <circle cx="58" cy="78" r="3" fill="#ffb703"/>
    <circle cx="542" cy="70" r="3" fill="#ffb703"/>
    <circle cx="542" cy="78" r="3" fill="#ffb703"/>
  </g>

  <!-- Eco Tag Stamp -->
  <g transform="translate(560, 470)">
    <rect width="180" height="60" rx="16" fill="#023047"/>
    <text x="90" y="28" fill="#ffb703" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle" letter-spacing="2">PLANT BIO-ACETATE</text>
    <text x="90" y="46" fill="#8ecae6" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">100% Biodegradable</text>
  </g>
</svg>
