<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="anorakBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E5DEC3"/>
    </linearGradient>
    <linearGradient id="terraRust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb8500"/>
      <stop offset="60%" stop-color="#C85A00"/>
      <stop offset="100%" stop-color="#8F3600"/>
    </linearGradient>
    <filter id="anorakShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#023047" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#anorakBg)"/>

  <!-- Recycled 3-Layer Storm Anorak Technical Jacket -->
  <g filter="url(#anorakShadow)" transform="translate(170, 70)">
    <!-- Hood with peaked storm visor -->
    <path d="M170 50 C170 -10 290 -10 290 50 L270 90 L190 90 Z" fill="#023047" stroke="#ffb703" stroke-width="2"/>
    <path d="M190 20 L270 20" stroke="#fb8500" stroke-width="4"/> <!-- Visor edge -->

    <!-- Main Jacket Torso -->
    <path d="M150 90 L310 90 L370 180 L350 420 L110 420 L90 180 Z" fill="url(#terraRust)" stroke="#023047" stroke-width="4"/>

    <!-- Sleeves -->
    <path d="M150 90 L60 260 L100 280 L160 160" fill="#023047"/>
    <path d="M310 90 L400 260 L360 280 L300 160" fill="#023047"/>

    <!-- Dual Color Contrast Yoke -->
    <path d="M150 90 L310 90 L330 160 L130 160 Z" fill="#023047"/>

    <!-- Waterproof Half-Zip Track with Orange Pull -->
    <line x1="230" y1="90" x2="230" y2="250" stroke="#023047" stroke-width="8"/>
    <line x1="230" y1="90" x2="230" y2="250" stroke="#FAF8F5" stroke-width="2"/>
    <rect x="224" y="240" width="12" height="24" rx="4" fill="#ffb703"/>

    <!-- Large Kangaroo Chest Anorak Flap Pocket -->
    <rect x="155" y="270" width="150" height="90" rx="14" fill="#023047" stroke="#ffb703" stroke-width="2"/>
    <text x="230" y="310" fill="#ffb703" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="3">SOLTERRA</text>
    <text x="230" y="326" fill="#8ecae6" font-family="sans-serif" font-weight="600" font-size="9" text-anchor="middle">PFAS-FREE 20,000MM</text>

    <!-- Pit Zips Underarms -->
    <line x1="120" y1="200" x2="140" y2="230" stroke="#ffb703" stroke-width="3"/>
    <line x1="340" y1="200" x2="320" y2="230" stroke="#ffb703" stroke-width="3"/>
  </g>

  <!-- Tag -->
  <g transform="translate(540, 480)">
    <rect width="210" height="52" rx="14" fill="#023047"/>
    <text x="105" y="24" fill="#ffb703" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="2">PFAS-FREE BIO-MEMBRANE</text>
    <text x="105" y="41" fill="#8ecae6" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">100% Recycled Nylon</text>
  </g>
</svg>
