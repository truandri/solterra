<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="hempBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EBE3D7"/>
    </linearGradient>
    <linearGradient id="duneHemp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373"/>
      <stop offset="60%" stop-color="#B88554"/>
      <stop offset="100%" stop-color="#8F5E33"/>
    </linearGradient>
    <filter id="shortShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#023047" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#hempBg)"/>

  <!-- Industrial Hemp Field Shorts -->
  <g filter="url(#shortShadow)" transform="translate(180, 110)">
    <!-- Waistband with integrated web belt -->
    <rect x="50" y="20" width="340" height="36" rx="8" fill="#023047"/>
    <rect x="70" y="27" width="300" height="22" rx="4" fill="#ffb703"/>
    <!-- Belt Buckle -->
    <rect x="195" y="22" width="50" height="32" rx="6" fill="#023047" stroke="#FAF8F5" stroke-width="2"/>
    <circle cx="220" cy="38" r="4" fill="#fb8500"/>

    <!-- Left & Right Short Legs -->
    <path d="M50 56 L390 56 L420 330 L250 330 L220 180 L190 330 L20 330 Z" fill="url(#duneHemp)" stroke="#023047" stroke-width="4"/>

    <!-- Reinforced Inseam Scramble Gusset -->
    <polygon points="190,330 220,180 250,330" fill="#023047" opacity="0.4"/>

    <!-- Mesh Water-Drain Cargo Pockets -->
    <rect x="50" y="140" width="100" height="110" rx="14" fill="#023047" stroke="#FAF8F5" stroke-width="2"/>
    <line x1="50" y1="170" x2="150" y2="170" stroke="#ffb703" stroke-width="3"/>
    <circle cx="100" cy="220" r="4" fill="#219ebc"/> <!-- Metal drain grommet -->

    <rect x="290" y="140" width="100" height="110" rx="14" fill="#023047" stroke="#FAF8F5" stroke-width="2"/>
    <line x1="290" y1="170" x2="390" y2="170" stroke="#ffb703" stroke-width="3"/>
    <circle cx="340" cy="220" r="4" fill="#219ebc"/> <!-- Metal drain grommet -->
  </g>

  <!-- Tag -->
  <g transform="translate(540, 480)">
    <rect width="210" height="52" rx="14" fill="#023047"/>
    <text x="105" y="24" fill="#ffb703" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="2">55% INDUSTRIAL HEMP</text>
    <text x="105" y="41" fill="#8ecae6" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Salt-Tear Resistant Canvas</text>
  </g>
</svg>
