<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="capBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E2DCD2"/>
    </linearGradient>
    <filter id="capShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#023047" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#capBg)"/>

  <!-- 5-Panel Organic Hemp Trail Cap -->
  <g filter="url(#capShadow)" transform="translate(180, 130)">
    <!-- Crown Dome -->
    <path d="M70 230 C70 90 350 90 350 230 Z" fill="#023047" stroke="#023047" stroke-width="4"/>

    <!-- 5-Panel Contrast Top Strip -->
    <path d="M160 100 L260 100 L270 230 L150 230 Z" fill="#fb8500"/>
    <!-- Ventilation metal eyelets -->
    <circle cx="120" cy="170" r="5" fill="#FAF8F5" stroke="#023047" stroke-width="2"/>
    <circle cx="300" cy="170" r="5" fill="#FAF8F5" stroke="#023047" stroke-width="2"/>

    <!-- Woven Mountain & Sun Front Patch -->
    <rect x="175" y="150" width="70" height="45" rx="6" fill="#023047" stroke="#ffb703" stroke-width="2"/>
    <circle cx="210" cy="165" r="7" fill="#ffb703"/>
    <polygon points="190,185 210,170 230,185" fill="#219ebc"/>

    <!-- Flat Curved Packable Visor (Recycled NetPlus) -->
    <path d="M50 230 Q 210 270 370 230 L430 290 Q 210 330 -10 290 Z" fill="#219ebc" stroke="#023047" stroke-width="4"/>
    <!-- Brim Stitching lines -->
    <path d="M10 280 Q 210 315 410 280" fill="none" stroke="#FAF8F5" stroke-width="2"/>
    <path d="M30 265 Q 210 295 390 265" fill="none" stroke="#FAF8F5" stroke-width="2"/>
  </g>

  <!-- Tag -->
  <g transform="translate(540, 480)">
    <rect width="210" height="52" rx="14" fill="#023047"/>
    <text x="105" y="24" fill="#ffb703" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="2">UPF 50+ NETPLUS VISOR</text>
    <text x="105" y="41" fill="#8ecae6" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Bamboo Terry Browband</text>
  </g>
</svg>
