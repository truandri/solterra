<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="ropeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E5DEC3"/>
    </linearGradient>
    <filter id="ropeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#023047" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#ropeBg)"/>

  <!-- Dynamic Climbing Rope Coiled Utility Leash & Aviation Brass Carabiner -->
  <g filter="url(#ropeShadow)" transform="translate(180, 100)">
    <!-- Coiled Kernmantle Rope loops -->
    <ellipse cx="220" cy="220" rx="190" ry="140" fill="none" stroke="#219ebc" stroke-width="26"/>
    <ellipse cx="220" cy="220" rx="190" ry="140" fill="none" stroke="#ffb703" stroke-width="8" stroke-dasharray="14 10"/>

    <ellipse cx="220" cy="220" rx="150" ry="105" fill="none" stroke="#fb8500" stroke-width="26"/>
    <ellipse cx="220" cy="220" rx="150" ry="105" fill="none" stroke="#023047" stroke-width="8" stroke-dasharray="14 10"/>

    <ellipse cx="220" cy="220" rx="110" ry="70" fill="none" stroke="#023047" stroke-width="26"/>
    <ellipse cx="220" cy="220" rx="110" ry="70" fill="none" stroke="#FAF8F5" stroke-width="8" stroke-dasharray="14 10"/>

    <!-- Padded Hand Loop at end -->
    <rect x="360" y="80" width="90" height="60" rx="20" fill="#023047" stroke="#ffb703" stroke-width="3"/>

    <!-- Aviation Heavy Brass 360 Swivel Carabiner Snap -->
    <g transform="translate(50, 260) rotate(-25)">
      <rect x="0" y="0" width="30" height="70" rx="14" fill="#D4AF37" stroke="#023047" stroke-width="3"/>
      <circle cx="15" cy="18" r="8" fill="#FAF8F5"/>
      <!-- Spring gate clasp -->
      <line x1="26" y1="25" x2="26" y2="55" stroke="#023047" stroke-width="5"/>
      <circle cx="15" cy="55" r="4" fill="#023047"/>
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(540, 480)">
    <rect width="210" height="52" rx="14" fill="#023047"/>
    <text x="105" y="24" fill="#ffb703" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="2">UPCYCLED CLIMBING ROPE</text>
    <text x="105" y="41" fill="#8ecae6" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Rated to 12kN Strength</text>
  </g>
</svg>
