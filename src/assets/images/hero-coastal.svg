<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#023047"/>
      <stop offset="40%" stop-color="#219ebc"/>
      <stop offset="70%" stop-color="#8ecae6"/>
      <stop offset="85%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="oceanSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#023047"/>
      <stop offset="50%" stop-color="#034566"/>
      <stop offset="100%" stop-color="#011b29"/>
    </linearGradient>
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2b1f"/>
      <stop offset="50%" stop-color="#221811"/>
      <stop offset="100%" stop-color="#120c08"/>
    </linearGradient>
  </defs>

  <!-- Sky & Atmospheric Sunset Glow -->
  <rect width="100%" height="700" fill="url(#skyGrad)"/>

  <!-- Golden Sun over Ocean Horizon -->
  <circle cx="500" cy="520" r="140" fill="#ffb703" opacity="0.95"/>
  <circle cx="500" cy="520" r="220" fill="#fb8500" opacity="0.25"/>

  <!-- Ocean Water Base -->
  <rect y="580" width="100%" height="620" fill="url(#oceanSurface)"/>

  <!-- Sun Gleam across Water Waves -->
  <polygon points="500,580 430,1200 570,1200" fill="#ffb703" opacity="0.35"/>
  <path d="M0 640 Q 250 620 500 640 T 1000 640" stroke="#8ecae6" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M0 720 Q 250 700 500 720 T 1000 720" stroke="#ffb703" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M0 800 Q 250 780 500 800 T 1000 800" stroke="#8ecae6" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M0 900 Q 250 880 500 900 T 1000 900" stroke="#ffb703" stroke-width="3" fill="none" opacity="0.3"/>

  <!-- Dramatic Coastal Headland & Red Sandstone Bluff -->
  <polygon points="-50,480 320,620 280,1250 -50,1250" fill="url(#cliffGrad)"/>
  <polygon points="680,620 1050,460 1050,1250 620,1250" fill="url(#cliffGrad)"/>

  <!-- Australian Coastal Vegetation / Banksia & Eucalyptus silhouettes on ridge -->
  <path d="M0 480 Q 80 440 160 480 T 320 620 L 260 650 L 0 540 Z" fill="#1b2a22"/>

  <!-- Modern Explorer standing on ridge looking over Pacific Horizon -->
  <g transform="translate(180, 480) scale(0.9)">
    <!-- Explorer Silhouette -->
    <!-- Head with trail cap -->
    <circle cx="50" cy="30" r="12" fill="#023047"/>
    <path d="M45 22 L66 22 L62 26 L45 26 Z" fill="#fb8500"/> <!-- cap brim -->
    <!-- Torso with anorak -->
    <path d="M35 45 L65 45 L70 110 L30 110 Z" fill="#023047"/>
    <!-- Expedition pack on back -->
    <rect x="15" y="50" width="22" height="45" rx="8" fill="#fb8500"/>
    <!-- Binoculars / Eyewear glint -->
    <circle cx="58" cy="30" r="3" fill="#ffb703"/>
    <!-- Legs in trail shorts & hiking boots -->
    <rect x="35" y="110" width="12" height="50" fill="#219ebc"/>
    <rect x="53" y="110" width="12" height="50" fill="#219ebc"/>
    <rect x="32" y="155" width="18" height="12" rx="4" fill="#023047"/>
    <rect x="52" y="155" width="18" height="12" rx="4" fill="#023047"/>
  </g>

  <!-- Flying Seabirds -->
  <path d="M680 320 Q 700 305 720 320 Q 740 305 760 320" fill="none" stroke="#FAF8F5" stroke-width="3" opacity="0.8"/>
  <path d="M740 280 Q 755 268 770 280 Q 785 268 800 280" fill="none" stroke="#FAF8F5" stroke-width="2.5" opacity="0.7"/>
</svg>
