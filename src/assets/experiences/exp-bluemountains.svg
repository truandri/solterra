<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bmNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021B29"/>
      <stop offset="60%" stop-color="#03324C"/>
      <stop offset="100%" stop-color="#064E77"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bmNight)"/>
  <!-- Southern Cross Stars & Stargazing Constellation -->
  <circle cx="650" cy="120" r="4" fill="#ffffff"/>
  <circle cx="680" cy="180" r="3.5" fill="#ffffff"/>
  <circle cx="610" cy="185" r="3.5" fill="#ffffff"/>
  <circle cx="640" cy="240" r="4.5" fill="#ffb703"/>
  <circle cx="660" cy="195" r="2.5" fill="#8ecae6"/>
  <!-- Sandstone Escarpment (Three Sisters Silhouette) -->
  <path d="M0 600 L120 380 L180 390 L220 350 L270 360 L320 380 L400 370 L550 500 L750 480 L1000 600 Z" fill="#010d14"/>
  <!-- Solar Camp Tent with Warm Glow -->
  <g transform="translate(680, 420)">
    <polygon points="60,0 0,110 120,110" fill="#fb8500" opacity="0.9"/>
    <polygon points="60,0 60,110 120,110" fill="#ffb703"/>
    <circle cx="60" cy="70" r="14" fill="#ffffff" opacity="0.9"/>
  </g>
  <text x="500" y="550" fill="#FAF8F5" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="3">BLUE MOUNTAINS SOLAR BASECAMP</text>
</svg>
