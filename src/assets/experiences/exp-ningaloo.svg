<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="ningalooLagoon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ecae6"/>
      <stop offset="40%" stop-color="#219ebc"/>
      <stop offset="100%" stop-color="#023047"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#ningalooLagoon)"/>
  <!-- Gentle Whale Shark Silhouette gliding through turquoise water -->
  <g transform="translate(300, 220) scale(1.1)">
    <path d="M-80 0 C-40 -45 140 -50 320 -10 C360 0 420 -30 450 -40 L440 0 L460 30 C420 15 360 5 320 15 C140 45 -40 45 -80 0 Z" fill="#023047"/>
    <!-- Fins -->
    <polygon points="120,-38 180,-110 200,-35" fill="#023047"/>
    <polygon points="160,32 190,95 210,25" fill="#023047"/>
    <!-- Bioluminescent Whale Shark Dappled Spot Pattern -->
    <circle cx="20" cy="-5" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="50" cy="-12" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="50" cy="5" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="80" cy="-18" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="80" cy="-2" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="80" cy="14" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="120" cy="-15" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="120" cy="2" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="160" cy="-8" r="3.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="200" cy="-4" r="3.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="240" cy="-2" r="3" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- Citizen Science Snorkeler above -->
  <g transform="translate(180, 100) scale(0.7)">
    <ellipse cx="60" cy="15" rx="45" ry="14" fill="#fb8500"/>
    <circle cx="110" cy="15" r="10" fill="#023047"/>
    <!-- Snorkel & mask -->
    <path d="M110 10 L120 -5" stroke="#ffb703" stroke-width="4"/>
  </g>
  <text x="500" y="540" fill="#FAF8F5" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="3">NINGALOO CITIZEN SCIENCE EXPEDITION</text>
</svg>
